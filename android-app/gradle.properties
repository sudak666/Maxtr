org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# KSP's Gradle plugin still registers generated sources via the legacy
# kotlin.sourceSets DSL internally, which AGP 9's built-in Kotlin rejects
# by default (see the real build error this suppresses, kept here for the
# next reader). Sanctioned escape hatch per AGP's own error message —
# not a hack.
android.disallowKotlinSourceSets=false
kotlin.code.style=official
