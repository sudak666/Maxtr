# Weekly update PRs, grouped so one PR per ecosystem per week, not one per
# package. Review and merge like any other PR (Android ones need a local
# build + QA run first, see CLAUDE.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups: { web: { patterns: ["*"] } }
    open-pull-requests-limit: 2
    ignore:
      # Only types: the app runs the vendored js/vendor/preact (10.x), so
      # npm preact must stay on the same major.
      - dependency-name: preact
        update-types: ["version-update:semver-major"]
      # Runtime SDK is the gstatic URL pinned in js/core.js + sw.js +
      # index.html; bump those by hand together with npm firebase.
      - dependency-name: firebase
  - package-ecosystem: npm
    directory: /functions
    schedule: { interval: weekly }
    groups: { functions: { patterns: ["*"] } }
    open-pull-requests-limit: 2
  - package-ecosystem: gradle
    directory: /android-app
    schedule: { interval: weekly }
    groups: { android: { patterns: ["*"] } }
    open-pull-requests-limit: 2
    ignore:
      # Billing majors change the purchase API (PremiumRepository); Billing 8
      # is accepted by Play until 2027-08-31. Upgrade by hand with a test purchase.
      - dependency-name: com.android.billingclient:*
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
    open-pull-requests-limit: 1
