name: Deploy Firestore Rules

# Publishes firestore.rules to the real maxtr-c238f project whenever it
# changes on main. The firestore-rules job in smoke-test.yml only asserts
# behavior against a local emulator (project rytm-rules-test) — this is the
# step that actually makes a merged rules change take effect for real users.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
  # Lets us run this once by hand right after this workflow itself merges,
  # to publish the DoRytm rules (#380) that landed before this workflow
  # existed — a push-only trigger would otherwise wait for the next
  # firestore.rules change to fire for the first time.
  workflow_dispatch:

jobs:
  # Same emulator test as smoke-test.yml's firestore-rules job: a push to
  # main deploys only if the rules it would publish pass it.
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rules-test dependencies
        run: |
          mkdir -p /tmp/rules-test
          cd /tmp/rules-test
          npm init -y >/dev/null
          npm install --no-audit --no-fund @firebase/rules-unit-testing firebase
          ln -s /tmp/rules-test/node_modules "$GITHUB_WORKSPACE/tests/node_modules"
      - name: Run Firestore rules tests
        working-directory: /tmp/rules-test
        run: |
          npx --yes firebase-tools@15.27.0 emulators:exec --only firestore --project rytm-rules-test "cd '$GITHUB_WORKSPACE' && node tests/firestore-rules.mjs"

  deploy:
    needs: rules-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules
        run: npx --yes firebase-tools@15.27.0 deploy --only firestore:rules --project maxtr-c238f --non-interactive
